log:
  formatter: glog
  level: debug
  filepath: ./log
  max_age: 604800s #168h
  max_count: 20
  rotate_interval: 86400s # 24h
  rotate_size: 104857600
  report_caller: true
  redirect: stdout

web:
  bind_address:
    port: 9090
  grpc:
    timeout: 0s
  http:
    api_formatter: trivial_api_v20
  debug:
    disable_print_inoutput_methods: [""]

  # OpenTelemetry 监控配置
  open_telemetry:
    enabled: false

  # QPS限流配置
  qps_limit:
    grpc:
      default_qps: 0
      default_burst: 0
      max_concurrency: 0
      method_qps: []
    http:
      default_qps: 0
      default_burst: 0
      max_concurrency: 0
      method_qps: []

palm:
  host: ""   # 刷掌平台 API 域名
  secret_key: ""  # API Token (Bearer)

# 数据库配置（排行榜等功能需要）
database:
  mysql:
    enabled: false                   # 设为 true 启用 MySQL
    address: "127.0.0.1:3306"        # MySQL 地址
    username: ""                     # 数据库用户名
    password: ""                     # 数据库密码
    db_name: "palm_racer"            # 数据库名
    max_connections: 10
    max_idle_connections: 5
    dial_timeout: 10s
    max_wait_duration: 20s
    fail_after_duration: 60s
    interpolate_params: true

  redis:
    enabled: false
    addresses:
      - "127.0.0.1:6380"
    password: ""
    db: 0
    max_connections: 100
    max_idle_connections: 10
    dial_timeout: 5s
    max_wait_duration: 20s
    fail_after_duration: 300s

# 功能开关配置（控制前端功能展示）
features:
  guest_mode: true            # 是否启用游客模式（登录页显示游客按钮）

# 计分鉴权配置
# 优先从环境变量 JWT_SECRET 读取，未设置时回退到此处的 jwt_secret。
# 生产环境建议仅通过环境变量注入，不要把密钥提交到版本库。
auth:
  jwt_secret: ""              # HMAC-SHA256 签名密钥（至少 32 字节）；空则拒绝所有提交

  token_ttl_seconds: 604800
  session_ttl_seconds: 5400   
